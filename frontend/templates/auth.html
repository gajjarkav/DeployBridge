<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeployBridge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <script>
        const savedTheme = localStorage.getItem('db_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Ubuntu:wght@700&display=swap");
        @import url('https://fonts.googleapis.com/css2?family=Montenegrin+Gothic+One&display=swap');
        
        /* ─── Theme Variables ─── */
        :root {
            --bg-color: #f5f5dc; /* Beige */
            --text-color: #000000;
            --primary-color: #000000; /* Solid Black */
            --primary-light: rgba(0, 0, 0, 0.1);
            --ambient-1: rgba(0, 0, 0, 0.03);
            --ambient-2: rgba(245, 245, 220, 0.5); /* Beige ambient */
            --brand-gradient-1: #000000;
            --brand-gradient-2: #444444; /* Dark gray for gradient */
        }

        [data-theme="dark"] {
            --bg-color: #000000; /* Solid Black */
            --text-color: #f5f5dc; /* Beige */
            --primary-color: #f5f5dc; /* Beige */
            --primary-light: rgba(245, 245, 220, 0.15);
            --ambient-1: rgba(245, 245, 220, 0.05);
            --ambient-2: rgba(0, 0, 0, 0.5);
            --brand-gradient-1: #f5f5dc;
            --brand-gradient-2: #e0e0b8; /* Slightly darker beige */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
        }
        
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            position: relative;
            overflow: hidden;
            /* Transition for browsers that don't support View Transitions API */
            transition: background-color 0.3s ease; 
        }

        /* ─── Top Navigation ─── */
        .top-nav {
            position: absolute;
            top: 24px;
            right: 32px;
            display: flex;
            align-items: center;
            gap: 24px;
            z-index: 50;
        }

        .docs-link {
            font-family: "Ubuntu", sans-serif;
            font-weight: 700;
            font-size: 15px;
            color: var(--text-color);
            text-decoration: underline;
            text-decoration-color: transparent; /* Invisible underline by default */
            text-underline-offset: 6px; /* Spacing between text and underline */
            text-decoration-thickness: 2px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        /* Simple text color change and underline reveal on hover */
        .docs-link:hover {
            color: var(--primary-color);
            text-decoration-color: var(--primary-color);
        }

        /* ─── Theme Toggle Button ─── */
        .theme-toggle {
            background: var(--primary-light);
            color: var(--primary-color);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, background 0.3s ease;
        }

        .theme-toggle:active {
            transform: scale(0.9);
        }

        .theme-toggle svg {
            position: absolute;
            width: 20px;
            height: 20px;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
        }

        /* Icon Animation Logic */
        .sun-icon {
            transform: translateY(0) rotate(0);
            opacity: 1;
        }
        .moon-icon {
            transform: translateY(-30px) rotate(-90deg);
            opacity: 0;
        }

        [data-theme="dark"] .sun-icon {
            transform: translateY(30px) rotate(90deg);
            opacity: 0;
        }
        [data-theme="dark"] .moon-icon {
            transform: translateY(0) rotate(0);
            opacity: 1;
        }

        /* ─── Soft ambient glow ─── */
        body::before {
            content: '';
            position: absolute;
            inset: -10%;
            background:
                radial-gradient(circle at 50% 50%, var(--ambient-1) 0%, transparent 55%),
                radial-gradient(circle at 80% 20%, var(--ambient-2) 0%, transparent 45%);
            pointer-events: none;
            z-index: 0;
            transition: background 0.5s ease;
        }

        /* ─── Hero Content Wrapper ─── */
        .hero-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 36px;
            max-width: 650px;
            padding: 0 24px;
        }

        .hero-text {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-color);
            opacity: 0.85;
            transition: color 0.3s ease, opacity 0.3s ease;
        }

        .hero-text strong {
            display: block;
            font-family: "Ubuntu", sans-serif;
            font-size: 1.35rem;
            margin-bottom: 12px;
            opacity: 1;
        }

        /* ─── Uiverse button styles (BaekCCI) ─── */
        .cta {
            position: relative;
            margin: auto;
            padding: 12px 18px;
            transition: all 0.2s ease;
            border: none;
            background: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            z-index: 1;
        }
        .cta::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            border-radius: 50px;
            background: var(--primary-light);
            width: 45px;
            height: 45px;
            transition: all 0.3s ease;
            z-index: -1;
        }
        .cta .github-icon {
            position: relative;
            width: 20px;
            height: 20px;
            margin-left: -5px;
            margin-right: 15px;
            color: var(--primary-color);
            flex-shrink: 0;
            transition: color 0.3s ease;
        }
        .cta span {
            position: relative;
            font-family: "Ubuntu", sans-serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--primary-color);
            white-space: nowrap;
            transition: color 0.3s ease;
        }
        .cta svg.arrow {
            position: relative;
            top: 0;
            margin-left: 10px;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke: var(--primary-color);
            stroke-width: 2;
            transform: translateX(-5px);
            transition: all 0.3s ease, stroke 0.3s ease;
            flex-shrink: 0;
        }
        .cta:hover::before {
            width: 100%;
        }
        .cta:hover svg.arrow {
            transform: translateX(0);
        }
        .cta:active {
            transform: scale(0.95);
        }

        /* ─── Big brand watermark ─── */
        .brand {
            font-family: "Montenegrin Gothic One", serif;
            font-weight: 400;
            font-style: normal;
            position: absolute;
            bottom: -27px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: clamp(56px, 13vw, 170px);
            letter-spacing: 0.02em;
            line-height: 1;
            pointer-events: none;
            user-select: none;
            background: linear-gradient(90deg, var(--brand-gradient-1), var(--brand-gradient-2), var(--brand-gradient-1));
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            opacity: 0.18;
            animation: shimmer 7s linear infinite;
            transition: background 0.3s ease;
        }

        .themeToggle {
            color: var(--primary-color);
            width: 22px;
            height: 22px;
        }

        .st-sunMoonThemeToggleBtn {
            position: relative;
            cursor: pointer;
        }

        .st-sunMoonThemeToggleBtn .themeToggleInput {
            opacity: 0;ans this q as per this pdf want ans from this pdf only and also for minimum 2 a4 size ans needed so write as per that long answer
            width: 100%;
            aspect-ratio: 1;
            cursor: pointer;
        }

        .st-sunMoonThemeToggleBtn svg {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            transition: transform .4s ease;
            transform: rotate(40deg);
        }

        .st-sunMoonThemeToggleBtn svg .sunMoon {
            transform-origin: center;
            transition: inherit;
            transform: scale(1);
        }

        .st-sunMoonThemeToggleBtn svg .sunRay {
            transform-origin: center;
            transform: scale(0);
        }

        .st-sunMoonThemeToggleBtn svg mask>circle {
            transition: transform .64s cubic-bezier(.41,.64,.32,1.575);
            transform: translate(0,0);
        }

        .st-sunMoonThemeToggleBtn svg .sunRay2 { animation-delay: .05s !important; }
        .st-sunMoonThemeToggleBtn svg .sunRay3 { animation-delay: .1s !important; }
        .st-sunMoonThemeToggleBtn svg .sunRay4 { animation-delay: .17s !important; }
        .st-sunMoonThemeToggleBtn svg .sunRay5 { animation-delay: .25s !important; }
        .st-sunMoonThemeToggleBtn svg .sunRay6 { animation-delay: .29s !important; }

        .st-sunMoonThemeToggleBtn .themeToggleInput:checked+svg {
            transform: rotate(90deg);
        }

        .st-sunMoonThemeToggleBtn .themeToggleInput:checked+svg mask>circle {
            transform: translate(16px,-3px);
        }

        .st-sunMoonThemeToggleBtn .themeToggleInput:checked+svg .sunMoon {
            transform: scale(.55);
        }

        .st-sunMoonThemeToggleBtn .themeToggleInput:checked+svg .sunRay {
            animation: showRay1832 .4s ease forwards;
        }

        @keyframes showRay1832 {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        @keyframes shimmer {
            to { background-position: 200% center; }
        }

        /* ─── View Transitions API Setup for Circle Spread ─── */
        ::view-transition-old(root),
        ::view-transition-new(root) {
            animation: none;
            mix-blend-mode: normal;
        }
        ::view-transition-new(root) {
            z-index: 9999; /* Ensure new theme expands OVER the old one */
        }
    </style>
</head>
<body>
    
    <div class="top-nav">
        <a href="#docs" class="docs-link">Docs</a>
        <label for="themeToggle" class="themeToggle st-sunMoonThemeToggleBtn">
            <input

            <svg

                <circle class="sunMoon" cx="10" cy="10" r="8" mask="url(#moon-mask)"></circle>

                <g>
                    <circle class="sunRay sunRay1" cx="18" cy="10" r="1.5"></circle>
                    <circle class="sunRay sunRay2" cx="14" cy="16.928" r="1.5"></circle>
                    <circle class="sunRay sunRay3" cx="6" cy="16.928" r="1.5"></circle>
                    <circle class="sunRay sunRay4" cx="2" cy="10" r="1.5"></circle>
                    <circle class="sunRay sunRay5" cx="6" cy="3.1718" r="1.5"></circle>
                    <circle class="sunRay sunRay6" cx="14" cy="3.1718" r="1.5"></circle>

    </div>

    <!-- Grouped the button and new text to keep them perfectly centered together -->
    <main class="hero-content">
        <button class="cta" id="login-btn" type="button">
            <svg class="github-icon" viewBox="0 0 16 16" aria-hidden="true">

        <p class="hero-text">
            <strong>Your Autonomous DevOps Agent.</strong>
            Experience self-healing CI/CD. Our Agentic AI instantly analyzes, builds, debugs, and deploys your GitHub repositories while monitoring 24/7 for anomalies.

    <div class="brand">DeployBridge</div>
    
    <script src="../js/auth.js"></script>
    <script>
        const themeToggle = document.getElementById("themeToggle");

        themeToggle.addEventListener("change", (e) =>  {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const nextTheme = isDark ? 'light' : 'dark';
            themeToggle.checked = nextTheme === "dark";

            // Fallback for browsers that don't support the View Transitions API
            if (!document.startViewTransition) {
                document.documentElement.setAttribute('data-theme', nextTheme);
                return;
            }

            // Get click coordinates for the circle origin
            const rect = themeToggle.getBoundingClientRect();
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;

            // Calculate the distance to the furthest corner to ensure the circle covers the screen
            const endRadius = Math.hypot(
                Math.max(x, window.innerWidth - x),
                Math.max(y, window.innerHeight - y)
            );

            // Start the view transition
            const transition = document.startViewTransition(() => {
                document.documentElement.setAttribute('data-theme', nextTheme);
            });

            // Animate the clipping path once the transition is ready
            transition.ready.then(() => {
                document.documentElement.animate(
                    {
                        clipPath: [
                            `circle(0px at ${x}px ${y}px)`,
                            `circle(${endRadius}px at ${x}px ${y}px)`
                        ]
                    },
                    {
                        duration: 600,
                        easing: "ease-in-out",
                        pseudoElement: "::view-transition-new(root)",
                    }
                );
            });
        });
    </script>
