<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
</head>
<body>
    <div id="dashboard-section">
        <h2>Welcome, <span id="user-name"></span>!</h2>
        
        <img id="user-avatar" src="" alt="Avatar" width="100" height="100" style="border-radius: 50%;">
        <br><br>
        <button id="logout-btn">Logout</button>

        <h3>Your Repositories</h3>
        <table border="1" style="width: 100%; text-align: left; border-collapse: collapse;">
            <thead>
                <tr>
                    <th style="padding: 8px;">#</th>
                    <th style="padding: 8px;">Repository Name</th>
                    <th style="padding: 8px;">Language</th>
                    <th style="padding: 8px;">Visibility</th>
                    <th style="padding: 8px;">Status</th>
                    <th style="padding: 8px;">Last Updated</th>
                    <th style="padding: 8px;">View</th>
                    <th style="padding: 8px;">Action</th>
                </tr>
            </thead>
            <tbody id="repo-table-body">
                <tr>
                    <td colspan="6" style="padding: 8px; text-align: center;">Loading repositories...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script src="../js/dashboard.js"></script>
</body>
</html>
