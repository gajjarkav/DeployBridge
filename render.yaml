services:
  - type: web
    name: deploybridge-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_NAME
        value: DeployBridge
      - key: APP_VERSION
        value: 1.0.0
      - key: APP_DESCRIPTION
        value: A deployment bridge for seamless application deployment.
      - key: DEBUG
        value: false
      - key: ENV_TYPE
        value: production
      - key: DOCS_URL
        value: /docs
      - key: REDOC_URL
        value: ""
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: LOG_LEVEL
        value: INFO
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10000
      - key: GROQ_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: GROQ_MODEL
        value: gemini-2.5-flash-lite
      - key: GROQ_TIMEOUT_SECONDS
        value: 60.0
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: REPORT_DELIVERY_ENABLED
        value: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      # ── Secrets — set these in Render Dashboard → Environment ──────────────
      # DATABASE_URL
      # GITHUB_CLIENT_ID
      # GITHUB_CLIENT_SECRET
      # GITHUB_TOKEN_ENCRYPTION_KEY
      # JWT_SECRET_KEY
      # AZURE_AI_ENDPOINT
      # AZURE_AI_DEPLOYMENT
      # AZURE_AI_API_KEY
      # GROQ_API_KEY
      # CLOUDINARY_CLOUD_NAME
      # CLOUDINARY_API_KEY
      # CLOUDINARY_API_SECRET
      # SMTP_USER
      # SMTP_PASSWORD
      # SMTP_FROM
